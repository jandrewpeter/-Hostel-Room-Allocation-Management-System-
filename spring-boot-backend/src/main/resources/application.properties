spring.application.name=northgate-hostel-allocation
server.port=8080

spring.datasource.url=jdbc:postgresql://${SQL_HOST:localhost}:5432/${SQL_DB_NAME:hostel_db}
spring.datasource.username=${SQL_USER:postgres}
spring.datasource.password=${SQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
